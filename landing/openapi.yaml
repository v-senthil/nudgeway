components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: nudgeway_session
      description: Signed session cookie.
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Programmatic access with per-org scoped key.

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          examples: ['ok', 'ready']

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          examples: ['admin@example.com']
        password:
          type: string
          format: password
          minLength: 1

    LoginResponse:
      type: object
      required: [user_id, org_id, permissions, expires_at]
      properties:
        user_id:
          type: string
          description: ULID of the authenticated user.
        org_id:
          type: string
          description: ULID of the user's organization.
        permissions:
          type: array
          items: { type: string }
          description: Permission keys granted to the user in this org.
        expires_at:
          type: string
          format: date-time

    Me:
      type: object
      required: [user_id, org_id, org_name, email, display_name, permissions]
      properties:
        user_id: { type: string }
        org_id: { type: string }
        org_name: { type: string }
        email: { type: string, format: email }
        display_name: { type: string }
        permissions:
          type: array
          items: { type: string }

    SendMessageRequest:
      type: object
      required: [conversation_id, type]
      description: |
        Payload for POST /api/v1/messages. `type` selects the canonical
        message shape; the corresponding sub-object (`text`, `template`,
        `media`, `interactive`, `location`, `reaction`) must be populated.
        Everything is provider-neutral — the channel adapter interprets it.
      properties:
        conversation_id:
          type: string
          description: ULID of the target conversation.
        type:
          type: string
          enum: [text, template, image, video, audio, document, sticker, interactive, location, reaction]
        text:
          type: object
          description: Present when type=text.
          required: [body]
          properties:
            body: { type: string }
            preview_url: { type: boolean }
        template:
          type: object
          description: Present when type=template.
          required: [name, language]
          properties:
            name: { type: string }
            language: { type: string, description: 'BCP47 or Meta locale.' }
            namespace: { type: string }
            components:
              type: array
              items:
                type: object
        media:
          type: object
          description: Present when type is one of image/video/audio/document/sticker.
          properties:
            kind: { type: string }
            media_id: { type: string }
            url: { type: string, format: uri }
            mime_type: { type: string }
            caption: { type: string }
            file_name: { type: string }
        interactive:
          type: object
          description: Present when type=interactive; forwarded verbatim.
        location:
          type: object
          description: Present when type=location.
          required: [latitude, longitude]
          properties:
            latitude: { type: number, format: double }
            longitude: { type: number, format: double }
            name: { type: string }
            address: { type: string }
        reaction:
          type: object
          description: Present when type=reaction.
          required: [message_id]
          properties:
            message_id: { type: string }
            emoji: { type: string }
        idempotency_key:
          type: string
          description: |
            Optional client-supplied key echoed to the provider (e.g. Meta's
            `biz_opaque_callback_data`). When absent the server uses the
            message ID.

    AttachmentUploadResponse:
      type: object
      required: [attachment_id, media_url, size, content_type]
      description: |
        Result of POST /api/v1/attachments. `attachment_id` is the
        content-addressed SHA-256 key; `media_url` is the fully-qualified
        URL the send worker hands to the provider under `media.url`.
      properties:
        attachment_id: { type: string }
        media_url: { type: string, format: uri }
        size: { type: integer, format: int64 }
        content_type: { type: string }
        filename: { type: string }

    SendMessageAccepted:
      type: object
      required: [message_id, status]
      properties:
        message_id:
          type: string
          description: ULID of the newly-created message row.
        status:
          type: string
          enum: [queued]

    Message:
      type: object
      required:
        - id
        - conversation_id
        - session_id
        - contact_id
        - channel
        - provider
        - direction
        - type
        - status
        - sender
        - recipient
        - created_at
      properties:
        id: { type: string }
        conversation_id: { type: string }
        session_id: { type: string }
        contact_id: { type: string }
        channel: { type: string }
        provider: { type: string }
        direction:
          type: string
          enum: [inbound, outbound]
        type: { type: string }
        status:
          type: string
          enum: [queued, sent, delivered, read, failed]
        sender: { type: string }
        recipient: { type: string }
        provider_message_id: { type: string }
        text: { type: string }
        media_url:
          type: string
          format: uri
          description: |
            Same-origin URL to fetch the media bytes. When the ingress
            pipeline has downloaded the provider's copy this is
            `/api/v1/media/{key}`; otherwise it may be a short-lived
            provider-native URL (Meta CDN, etc.).
        content_type:
          type: string
          description: MIME type persisted alongside the media bytes.
        location:
          type: object
          description: |
            Populated when `type == "location"`. Latitude/longitude are
            always present; name/address/url are optional.
          properties:
            latitude: { type: number, format: double }
            longitude: { type: number, format: double }
            name: { type: string }
            address: { type: string }
            url: { type: string, format: uri }
        contacts:
          type: array
          description: Populated when `type == "contacts"`. One entry per shared vCard.
          items:
            type: object
            properties:
              name: { type: string }
              phones:
                type: array
                items: { type: string }
              emails:
                type: array
                items: { type: string, format: email }
        reaction:
          type: object
          description: |
            Populated when `type == "reaction"`. `message_id` is the
            provider-native id (e.g. wamid) of the reacted-to message.
            Empty `emoji` means the reaction was removed.
          properties:
            emoji: { type: string }
            message_id: { type: string }
        interactive:
          type: object
          description: |
            Populated when `type == "interactive"` (or `type == "button"` for
            template quick replies). Kind mirrors Meta's discriminator —
            `button_reply`, `list_reply`, `button`, `cta_url`, `flow`, …
          properties:
            kind: { type: string }
            id: { type: string }
            title: { type: string }
            description: { type: string }
        reply_to_provider_message_id:
          type: string
          description: |
            Provider-native id (e.g. wamid) of the message this one replies
            to. Frontends use it to attach reactions to the referenced
            bubble or render a "replying to" chip.
        created_at: { type: string, format: date-time }
        sent_at: { type: string, format: date-time }
        delivered_at: { type: string, format: date-time }
        read_at: { type: string, format: date-time }

    MessageList:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        next_cursor:
          type: string
          description: Opaque cursor for the next page; absent when done.

    Conversation:
      type: object
      required: [id, status, created_at]
      properties:
        id: { type: string }
        session_id: { type: string }
        contact_id: { type: string }
        status:
          type: string
          enum: [open, pending, resolved, reopened]
        assigned_user_id: { type: string }
        assigned_team_id: { type: string }
        priority:
          type: string
          enum: [low, normal, high, urgent]
        unread_count: { type: integer }
        last_message_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    ConversationList:
      type: object
      required: [conversations]
      properties:
        conversations:
          type: array
          items: { $ref: '#/components/schemas/Conversation' }
        next_cursor:
          type: string
          description: Opaque cursor for the next page; absent when done.

    Integration:
      type: object
      description: |
        A provider integration owned by the current organization.
        Credential material is NEVER included in this schema; the
        `webhook_url` is the tenant-facing URL for provider consoles.
      required: [id, org_id, type, provider, name, status, config, capabilities, created_at, updated_at]
      properties:
        id: { type: string }
        org_id: { type: string }
        type:
          type: string
          enum: [channel, ticketing, bot, ai, calling]
        provider:
          type: string
          examples: ['whatsapp']
        name: { type: string }
        status:
          type: string
          enum: [connected, disconnected, degraded, auth_failed, rate_limited]
        config:
          type: object
          additionalProperties: true
          description: Non-secret provider configuration. Never contains credentials.
        capabilities:
          type: object
          additionalProperties: { type: boolean }
        health:
          type: object
          additionalProperties: true
        webhook_url:
          type: string
          description: URL to paste into the provider's webhook console.
          examples: ['https://app.example.com/webhooks/whatsapp/01H…']
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    IntegrationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Integration' }

    CreateIntegrationRequest:
      type: object
      required: [provider, name, config, secrets]
      properties:
        type:
          type: string
          enum: [channel, ticketing, bot, ai, calling]
          description: Optional; validated against the provider's registered kind.
        provider:
          type: string
          examples: ['whatsapp']
        name:
          type: string
          examples: ['Acme Support Line']
        config:
          type: object
          additionalProperties: true
          description: |
            Non-secret provider configuration. For WhatsApp:
            `phone_number_id`, `waba_id`.
        secrets:
          type: object
          additionalProperties: { type: string }
          description: |
            Envelope-encrypted at rest; never returned in any response.
            For WhatsApp: `access_token`, `app_secret`, `verify_token`.

    TestIntegrationResponse:
      type: object
      required: [ok, message, checked_at]
      properties:
        ok: { type: boolean }
        message: { type: string }
        checked_at: { type: string, format: date-time }

    AuditLog:
      type: object
      description: |
        A single append-only entry in the tenant audit trail. Written from
        every mutation path (integration lifecycle, message send / read,
        attachment upload, login / logout). Metadata is a free-form
        JSON object interpreted by the emitting caller.
      required: [id, org_id, action, resource_type, occurred_at]
      properties:
        id:
          type: string
          description: BIGINT primary key rendered as a decimal string.
        org_id:
          type: string
          description: Owning tenant ULID.
        actor_user_id:
          type: string
          description: Operator ULID. Empty for system-driven actions.
        action:
          type: string
          description: Verb identifying the mutation.
          examples: ['integration.created', 'message.sent', 'user.logged_in']
        resource_type:
          type: string
          examples: ['integration', 'message', 'conversation', 'attachment', 'session']
        resource_id:
          type: string
          description: Affected entity identifier; empty for bulk actions.
        ip:
          type: string
          description: Client IP address (IPv4 dotted or IPv6).
        metadata:
          type: object
          additionalProperties: true
        occurred_at:
          type: string
          format: date-time

    AuditLogList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditLog' }
        next_cursor:
          type: string
          description: Opaque continuation token; absent when the caller reached the end.

    AuditLogFilter:
      type: object
      description: |
        Reified filter shape mirroring the GET /audit-logs query
        parameters. Present as a schema so codegen surfaces a strongly
        typed builder for the frontend hook.
      properties:
        resource_type: { type: string }
        resource_id: { type: string }
        action: { type: string }
        actor_user_id: { type: string }
        since: { type: string, format: date-time }
        until: { type: string, format: date-time }
        cursor: { type: string }
        limit:
          type: integer
          minimum: 1
          maximum: 200

    ProviderCall:
      type: object
      description: |
        One entry in the operator-facing execution log — the record of a
        single outbound HTTP call the provider adapters made to a
        third-party API.
      required: [id, org_id, provider, operation, direction, method, url, status_code, latency_ms, occurred_at]
      properties:
        id:
          type: integer
          format: int64
          description: Internal auto-increment identifier.
        org_id:
          type: string
          description: Tenant ULID.
        integration_id:
          type: string
          description: Owning integration ULID. Absent when a very-early failure prevented the integration row from being loaded.
        provider:
          type: string
          description: Registry key of the calling adapter (e.g. `whatsapp`).
        operation:
          type: string
          description: |
            Adapter operation name — one of `send_message`, `mark_as_read`,
            `get_media_url`, `download_media`, `list_templates`,
            `create_template`, `get_template_status`, `upload_media`.
        direction:
          type: string
          enum: [outbound, inbound]
          description: Only `outbound` is written today.
        method:
          type: string
          description: HTTP verb.
        url:
          type: string
          description: Fully-qualified request URL (no secrets).
        status_code:
          type: integer
          description: HTTP status. Zero when the request never completed.
        latency_ms:
          type: integer
          format: int64
          description: Wall-clock duration of the request in milliseconds.
        request_body:
          type: string
          description: Base64-encoded request body (truncated at 64 KiB). Empty for GETs.
        response_body:
          type: string
          description: Base64-encoded response body (truncated at 64 KiB). Empty for `download_media`.
        request_body_text:
          type: string
          description: Best-effort UTF-8 rendering of the request body — populated when the bytes are probably text (e.g. JSON).
        response_body_text:
          type: string
          description: Best-effort UTF-8 rendering of the response body.
        error_class:
          type: string
          description: Failure classification (`transient`, `rate_limited`, `auth`, `permanent`, `unknown`). Empty on success.
        error_message:
          type: string
          description: Short human-readable failure message.
        trace_id:
          type: string
          description: Provider trace identifier (Meta's `fbtrace_id`).
        correlation_id:
          type: string
          description: Correlation ID stitching the entry to the originating request / job.
        occurred_at:
          type: string
          format: date-time

    ProviderCallList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProviderCall' }
        next_cursor:
          type: string
          description: Opaque token to echo back as `cursor` on the next request; absent when the caller reached the end.

    APIToken:
      type: object
      description: Safe list-view projection of an API token. NEVER includes plaintext or hash.
      required: [id, name, prefix, created_at]
      properties:
        id:
          type: string
          description: ULID of the api_tokens row.
        name:
          type: string
          description: Human-friendly label, chosen by the caller at create time.
          maxLength: 120
        prefix:
          type: string
          description: 8-character plaintext prefix, safe to log. Uniquely identifies the token in listings.
          minLength: 8
          maxLength: 8
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the most recent successful bearer verify. Best-effort — updated asynchronously.
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Optional expiry — after this instant the token is rejected as invalid.
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: When set, the token is permanently invalid.

    APITokenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/APIToken' }

    CreateAPITokenRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Human-friendly label (e.g. "mcp server local", "gh actions ci").
        expires_in_days:
          type: integer
          minimum: 1
          nullable: true
          description: Optional expiry, expressed in days from creation. Omit for a non-expiring token.

    CreateAPITokenResponse:
      type: object
      description: |
        The `plaintext` field is the FULL token (`nk_<prefix>_<secret>`) and
        is returned exactly once — at creation time. It is never persisted
        server-side; only the prefix and an argon2id hash of the secret are
        stored.
      required: [id, name, prefix, plaintext, created_at]
      properties:
        id:
          type: string
          description: ULID of the newly-minted api_tokens row.
        name:
          type: string
          maxLength: 120
        prefix:
          type: string
          minLength: 8
          maxLength: 8
          description: Indexed plaintext prefix, safe to log.
        plaintext:
          type: string
          description: |
            Full token (`nk_<prefix>_<secret>`). Store this in a password
            manager immediately — it will never be shown again.
          examples: ['nk_abcd1234_efghijklmnopqrstuvwxyz234567abcdefghijklmnop']
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true

    APITokenUsageEntry:
      type: object
      description: |
        One per-request execution-log row for an API token. Request +
        response bodies are capped at 8KB (see `request_bytes` /
        `response_bytes` for the true wire size) and JSON-redacted for
        known secret keys (`password`, `access_token`, `token`, ...).
      required: [id, token_id, occurred_at, method, path, status_code, latency_ms, remote_ip, request_bytes, response_bytes]
      properties:
        id:
          type: string
          description: ULID of the usage row.
        token_id:
          type: string
          description: ULID of the api_tokens row that authenticated the request.
        occurred_at:
          type: string
          format: date-time
        request_id:
          type: string
          description: Request ID stitching this row to the request-scoped log lines.
        method:
          type: string
          description: HTTP method (GET, POST, ...).
        path:
          type: string
          description: Request URL path — query string is never persisted.
          maxLength: 500
        status_code:
          type: integer
          minimum: 0
          maximum: 599
        latency_ms:
          type: integer
          description: Handler duration in milliseconds.
        remote_ip:
          type: string
          maxLength: 45
        user_agent:
          type: string
          maxLength: 500
        request_body:
          type: string
          description: Base64-encoded captured request body (up to 8KB after redaction).
        response_body:
          type: string
          description: Base64-encoded captured response body (up to 8KB).
        request_body_text:
          type: string
          description: Best-effort UTF-8 rendering of the request body when it decodes as text.
        response_body_text:
          type: string
          description: Best-effort UTF-8 rendering of the response body when it decodes as text.
        request_bytes:
          type: integer
          description: True wire size of the request body, before truncation.
        response_bytes:
          type: integer
          description: True wire size of the response body, before truncation.
        error_message:
          type: string
          description: Short failure summary — populated only for 4xx/5xx responses.
          maxLength: 1000

    APITokenUsageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/APITokenUsageEntry' }
        next_cursor:
          type: string
          description: Opaque token to echo back as `cursor` on the next request; absent when the caller reached the end.

    APITokenDailyPoint:
      type: object
      description: One (day, aggregate) tuple in an API-token metrics series.
      required: [day, total_requests, error_count, avg_latency_ms, bytes_in, bytes_out]
      properties:
        day:
          type: string
          format: date
          description: ISO calendar date (YYYY-MM-DD) in UTC.
        total_requests:
          type: integer
          format: int64
        error_count:
          type: integer
          format: int64
          description: Subset of total_requests whose status_code >= 400.
        avg_latency_ms:
          type: integer
          format: int64
        bytes_in:
          type: integer
          format: int64
        bytes_out:
          type: integer
          format: int64

    APITokenPathHit:
      type: object
      description: One entry in the top-paths ranking.
      required: [path, count]
      properties:
        path:
          type: string
        count:
          type: integer
          format: int64

    APITokenMetrics:
      type: object
      description: Aggregate KPIs + per-day series + status histogram + top paths for one API token.
      required: [total_requests, error_count, avg_latency_ms, bytes_in, bytes_out, by_day, by_status, top_paths]
      properties:
        total_requests:
          type: integer
          format: int64
        error_count:
          type: integer
          format: int64
        avg_latency_ms:
          type: integer
          format: int64
        bytes_in:
          type: integer
          format: int64
        bytes_out:
          type: integer
          format: int64
        by_day:
          type: array
          items: { $ref: '#/components/schemas/APITokenDailyPoint' }
        by_status:
          type: object
          description: Map of HTTP status code (as string) to count.
          additionalProperties:
            type: integer
            format: int64
        top_paths:
          type: array
          items: { $ref: '#/components/schemas/APITokenPathHit' }

    TemplateCategory:
      type: string
      enum: [MARKETING, UTILITY, AUTHENTICATION]

    TemplateStatus:
      type: string
      enum: [DRAFT, PENDING, APPROVED, REJECTED, PAUSED, DISABLED]

    TemplateComponent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          description: HEADER, BODY, FOOTER, BUTTONS, CAROUSEL, ...
        format:
          type: string
          description: Header format when type=HEADER (TEXT, IMAGE, VIDEO, DOCUMENT, LOCATION).
        text:
          type: string
        example:
          type: object
          additionalProperties: true
        buttons:
          type: array
          items:
            type: object
            additionalProperties: true
        cards:
          type: array
          items:
            type: object
            additionalProperties: true
        extra:
          type: object
          additionalProperties: true

    Template:
      type: object
      required: [id, org_id, integration_id, name, language, category, status, components, variables, created_at, updated_at]
      properties:
        id: { type: string }
        org_id: { type: string }
        integration_id: { type: string }
        provider_template_id: { type: string }
        name: { type: string }
        language: { type: string }
        category: { $ref: '#/components/schemas/TemplateCategory' }
        status: { $ref: '#/components/schemas/TemplateStatus' }
        components:
          type: array
          items: { $ref: '#/components/schemas/TemplateComponent' }
        variables:
          type: object
          additionalProperties: { type: string }
        last_synced_at:
          type: string
          format: date-time
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TemplateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Template' }
        next_cursor: { type: string }

    CreateTemplateRequest:
      type: object
      required: [integration_id, name, language, category, components]
      properties:
        integration_id: { type: string }
        name:
          type: string
          description: Lowercase alphanumeric + underscore; 1-512 chars.
        language: { type: string }
        category: { $ref: '#/components/schemas/TemplateCategory' }
        components:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/TemplateComponent' }
        submit:
          type: boolean
          default: false
          description: When true, submit to the provider in the same request.
        allow_category_change:
          type: boolean
          default: false

    UpdateTemplateRequest:
      type: object
      required: [category, components]
      description: |
        Partial update body for PUT /api/v1/templates/{id}. Only
        `category` + `components` are patchable — `name`, `language`,
        `integration_id` are the natural key on the provider side and
        cannot be changed.
      properties:
        category: { $ref: '#/components/schemas/TemplateCategory' }
        components:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/TemplateComponent' }

    SyncTemplatesRequest:
      type: object
      required: [integration_id]
      properties:
        integration_id: { type: string }

    SyncTemplatesResponse:
      type: object
      required: [fetched, upserted]
      properties:
        fetched: { type: integer }
        upserted: { type: integer }

    Group:
      type: object
      required: [id, org_id, integration_id, provider_group_id, subject, size, is_admin, created_at, updated_at]
      properties:
        id: { type: string, description: 'ULID' }
        org_id: { type: string, description: 'ULID' }
        integration_id: { type: string, description: 'ULID' }
        provider_group_id: { type: string, description: 'Meta group id' }
        subject: { type: string }
        description: { type: string }
        size: { type: integer, minimum: 0 }
        is_admin: { type: boolean, description: 'Our business phone number is admin in this group' }
        metadata:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    GroupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Group' }
        next_cursor: { type: string }

    GroupMember:
      type: object
      required: [id, group_id, role, joined_at]
      properties:
        id: { type: integer, format: int64 }
        group_id: { type: string }
        contact_id: { type: string, description: 'resolved ULID, if any' }
        wa_id: { type: string, description: 'E.164 without +' }
        bsuid: { type: string, description: 'business-scoped user id' }
        role:
          type: string
          enum: [member, admin, superadmin]
        joined_at: { type: string, format: date-time }
        left_at: { type: string, format: date-time, nullable: true }

    GroupMemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GroupMember' }

    CreateGroupRequest:
      type: object
      required: [integration_id, subject]
      properties:
        integration_id: { type: string, description: 'ULID of the whatsapp integration' }
        subject:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 2048
        join_approval_mode:
          type: string
          enum: [auto_approve, approval_required]

    SyncGroupsRequest:
      type: object
      required: [integration_id]
      properties:
        integration_id: { type: string, description: 'ULID of the whatsapp integration to sync' }

    SyncGroupsResponse:
      type: object
      required: [groups_upserted, members_upserted]
      properties:
        groups_upserted: { type: integer, minimum: 0 }
        members_upserted: { type: integer, minimum: 0 }

    SendGroupMessageRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [text, template, image, video, audio, document, sticker]
        text: { type: object, description: 'TextPayload (canonical)' }
        template: { type: object, description: 'TemplatePayload' }
        media: { type: object, description: 'MediaPayload — media_id or url' }
        idempotency_key: { type: string }

    SendGroupMessageAccepted:
      type: object
      required: [message_id, status]
      properties:
        message_id: { type: string }
        status: { type: string, enum: [queued] }

    RecordingOptions:
      type: object
      properties:
        enabled: { type: boolean }
        purpose: { type: string, maxLength: 250 }
        announcement_language: { type: string }

    TranscriptionOptions:
      type: object
      properties:
        enabled: { type: boolean }
        purpose: { type: string, maxLength: 250 }
        announcement_language: { type: string }

    InitiateCallRequest:
      type: object
      required: [integration_id]
      properties:
        integration_id: { type: string }
        to: { type: string }
        to_user_id: { type: string }
        contact_id: { type: string }
        idempotency_key: { type: string }
        recording: { $ref: '#/components/schemas/RecordingOptions' }
        transcription: { $ref: '#/components/schemas/TranscriptionOptions' }

    InitiateCallAccepted:
      type: object
      required: [call_id, status]
      properties:
        call_id: { type: string }
        status: { type: string }

    AnswerCallRequest:
      type: object
      description: |
        Optional body for POST /api/v1/calls/{id}/answer. When empty, the
        call is answered without an SDP negotiation. When `sdp` is
        present, the server treats the payload as a WebRTC answer.
      properties:
        sdp: { type: string }
        recording: { $ref: '#/components/schemas/RecordingOptions' }
        transcription: { $ref: '#/components/schemas/TranscriptionOptions' }

    RejectCallRequest:
      type: object
      description: Optional body for POST /api/v1/calls/{id}/reject.
      properties:
        reason: { type: string }

    Call:
      type: object
      required: [id, org_id, provider, provider_call_id, direction, status, created_at]
      properties:
        id: { type: string }
        org_id: { type: string }
        integration_id: { type: string }
        business_endpoint_id: { type: string }
        contact_id: { type: string }
        session_id: { type: string }
        conversation_id: { type: string }
        provider: { type: string }
        provider_call_id: { type: string }
        direction: { type: string, enum: [inbound, outbound] }
        status:
          type: string
          enum: [queued, ringing, answered, in_progress, completed, missed, failed, declined, no_answer]
        from: { type: string }
        to: { type: string }
        from_user_id: { type: string }
        to_user_id: { type: string }
        started_at: { type: string, format: date-time }
        answered_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        duration_seconds: { type: integer }
        hangup_reason: { type: string }
        recording_url: { type: string }
        transcription_ref: { type: string }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CallList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Call' }
        next_cursor: { type: string }

    CallSession:
      type: object
      required: [sdp_type, sdp]
      description: SDP offer captured on the provider `connect` webhook.
      properties:
        sdp_type:
          type: string
          description: SDP kind (`offer`).
        sdp:
          type: string
          description: The raw SDP blob the browser feeds into RTCPeerConnection.

    CallPermissionRequestBody:
      type: object
      required: [integration_id, to]
      properties:
        integration_id: { type: string }
        to:
          type: string
          description: Recipient E.164 phone number without the leading +.
        prompt:
          type: string
          description: Optional operator-supplied prompt shown alongside the permission request.

    CallPermissionRequestResponse:
      type: object
      required: [wamid]
      properties:
        wamid:
          type: string
          description: Provider-issued message id of the outbound permission-request interactive.

    AnalyticsOverview:
      type: object
      required: [messages_total, delivery_rate_pct, response_time_seconds_p50, conversations_opened]
      properties:
        messages_total:
          type: integer
          format: int64
          description: Total messages in the range, pan-provider.
        delivery_rate_pct:
          type: integer
          format: int64
          minimum: 0
          maximum: 100
          description: Delivered / sent as a percentage in the 0..100 range. Zero when Sent is zero.
        response_time_seconds_p50:
          type: integer
          format: int64
          description: |
            Coarse p50 of the per-day average response time (seconds
            between an inbound message and the next outbound reply).
        conversations_opened:
          type: integer
          format: int64

    AnalyticsPoint:
      type: object
      required: [day, value]
      properties:
        day:
          type: string
          format: date
        value:
          type: integer
          format: int64

    AnalyticsSeries:
      type: object
      required: [name, points]
      properties:
        name:
          type: string
        points:
          type: array
          items: { $ref: '#/components/schemas/AnalyticsPoint' }

    MetaMessagingAnalyticsDataPoint:
      type: object
      required: [start, end, sent, delivered]
      properties:
        start: { type: integer, format: int64, description: UNIX seconds. }
        end:   { type: integer, format: int64, description: UNIX seconds. }
        sent:      { type: integer, format: int64 }
        delivered: { type: integer, format: int64 }

    MetaMessagingAnalyticsPayload:
      type: object
      properties:
        phone_numbers: { type: array, items: { type: string } }
        country_codes: { type: array, items: { type: string } }
        granularity:   { type: string }
        data_points:
          type: array
          items: { $ref: '#/components/schemas/MetaMessagingAnalyticsDataPoint' }

    MetaMessagingAnalytics:
      type: object
      required: [analytics]
      properties:
        analytics: { $ref: '#/components/schemas/MetaMessagingAnalyticsPayload' }
        id:        { type: string, description: WABA ID Meta echoed back. }

    MetaConversationAnalyticsDataPoint:
      type: object
      required: [start, end]
      properties:
        start: { type: integer, format: int64 }
        end:   { type: integer, format: int64 }
        conversation:          { type: integer, format: int64 }
        phone_number:          { type: string }
        country:               { type: string }
        conversation_type:     { type: string }
        conversation_direction: { type: string }
        conversation_category: { type: string }
        cost:                  { type: number, format: double }

    MetaConversationAnalyticsData:
      type: object
      properties:
        data_points:
          type: array
          items: { $ref: '#/components/schemas/MetaConversationAnalyticsDataPoint' }

    MetaConversationAnalyticsPayload:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/MetaConversationAnalyticsData' }

    MetaConversationAnalytics:
      type: object
      required: [conversation_analytics]
      properties:
        conversation_analytics: { $ref: '#/components/schemas/MetaConversationAnalyticsPayload' }
        id: { type: string }

    MetaPricingAnalyticsDataPoint:
      type: object
      required: [start, end]
      properties:
        start: { type: integer, format: int64 }
        end:   { type: integer, format: int64 }
        country:          { type: string }
        phone_number:     { type: string }
        tier:             { type: string, description: 'Concatenation "<LOWER>:<UPPER>" or "0:MAX"; omitted for free messages.' }
        pricing_type:     { type: string }
        pricing_category: { type: string }
        volume:           { type: integer, format: int64 }
        cost:             { type: number, format: double }

    MetaPricingAnalyticsData:
      type: object
      properties:
        data_points:
          type: array
          items: { $ref: '#/components/schemas/MetaPricingAnalyticsDataPoint' }

    MetaPricingAnalyticsPayload:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/MetaPricingAnalyticsData' }

    MetaPricingAnalytics:
      type: object
      required: [pricing_analytics]
      properties:
        pricing_analytics: { $ref: '#/components/schemas/MetaPricingAnalyticsPayload' }
        id: { type: string }

    MetaCallAnalyticsDataPoint:
      type: object
      required: [start, end]
      properties:
        start: { type: integer, format: int64 }
        end:   { type: integer, format: int64 }
        count:            { type: integer, format: int64 }
        cost:             { type: number, format: double }
        average_duration: { type: integer, format: int64, description: Seconds. }
        phone_number:     { type: string }
        country:          { type: string }
        direction:        { type: string }

    MetaCallAnalyticsPayload:
      type: object
      properties:
        granularity: { type: string }
        data_points:
          type: array
          items: { $ref: '#/components/schemas/MetaCallAnalyticsDataPoint' }

    MetaCallAnalytics:
      type: object
      required: [call_analytics]
      properties:
        call_analytics: { $ref: '#/components/schemas/MetaCallAnalyticsPayload' }
        id: { type: string }

    MetaTemplateAnalyticsCost:
      type: object
      required: [type, value]
      properties:
        type:  { type: string, description: 'amount_spent | cost_per_delivered | cost_per_url_button_click' }
        value: { type: number, format: double }

    MetaTemplateAnalyticsClick:
      type: object
      required: [type, count]
      properties:
        type:           { type: string, description: 'url_button | unique_url_button | quick_reply_button' }
        button_content: { type: string }
        count:          { type: integer, format: int64 }

    MetaTemplateAnalyticsDataPoint:
      type: object
      required: [template_id, start, end]
      properties:
        template_id: { type: string }
        start:       { type: integer, format: int64 }
        end:         { type: integer, format: int64 }
        sent:      { type: integer, format: int64 }
        delivered: { type: integer, format: int64 }
        read:      { type: integer, format: int64 }
        clicked:
          type: array
          items: { $ref: '#/components/schemas/MetaTemplateAnalyticsClick' }
        cost:
          type: array
          items: { $ref: '#/components/schemas/MetaTemplateAnalyticsCost' }

    MetaTemplateAnalyticsBucket:
      type: object
      properties:
        waba_timezone: { type: string }
        granularity:   { type: string }
        product_type:  { type: string }
        data_points:
          type: array
          items: { $ref: '#/components/schemas/MetaTemplateAnalyticsDataPoint' }

    MetaTemplateAnalyticsPaging:
      type: object
      properties:
        cursors:
          type: object
          properties:
            before: { type: string }
            after:  { type: string }

    MetaTemplateAnalytics:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/MetaTemplateAnalyticsBucket' }
        paging: { $ref: '#/components/schemas/MetaTemplateAnalyticsPaging' }

    BusinessProfile:
      type: object
      description: |
        Provider-agnostic view of a channel business profile edited from
        the settings drawer. Mirrors the WhatsApp adapter's shape
        one-to-one for now; later channel providers map into the same
        set.
      properties:
        about: { type: string }
        address: { type: string }
        description: { type: string }
        email: { type: string, format: email }
        profile_picture_url: { type: string, format: uri }
        vertical: { type: string }
        websites:
          type: array
          items: { type: string, format: uri }

    WeeklyHours:
      type: object
      required: [day_of_week, open_time, close_time]
      description: A single day's open/close window. Times are Meta's `HHMM` format.
      properties:
        day_of_week: { type: string }
        open_time: { type: string }
        close_time: { type: string }

    CallHours:
      type: object
      properties:
        status: { type: string }
        timezone_id: { type: string }
        weekly_operating_hours:
          type: array
          items: { $ref: '#/components/schemas/WeeklyHours' }

    CallSettings:
      type: object
      description: Provider-agnostic view of per-integration call settings.
      properties:
        status: { type: string }
        call_icon_visibility: { type: string }
        call_hours: { $ref: '#/components/schemas/CallHours' }
        callback_permission_status: { type: string }

    CallPermission:
      type: object
      description: |
        Provider-agnostic view of a recipient's WhatsApp call-permission
        state.
      properties:
        status:
          type: string
          description: One of `no_permission`, `temporary`, `permanent` (provider-defined).
        expiration_time:
          type: integer
          format: int64
          description: Unix seconds when a `temporary` permission expires; zero when not applicable.

    OBAStatus:
      type: object
      description: Compact view of an Official Business Account application.
      properties:
        oba_status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, CANCELLED, NOT_APPLIED]
        status_message: { type: string }

    Username:
      type: object
      description: |
        Provider-neutral view of a Business-Scoped Username. Empty
        `username` means no username is currently adopted — this is a
        valid steady state.
      properties:
        username: { type: string }
        status:
          type: string
          description: '"approved" | "reserved" | ""'

    SetUsernameRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
          description: The desired Business-Scoped Username.
        transfer_action:
          type: string
          description: |
            How to resolve a conflict when another business already owns
            the username. Defaults to `none` when omitted.

    UsernameSuggestions:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          items: { type: string }

    PhoneNumber:
      type: object
      description: |
        Provider-neutral view of the channel phone number as returned by
        the settings drawer. Mirrors the WhatsApp adapter's PhoneNumber
        shape one-to-one; later channels map into the same set.
      properties:
        id: { type: string }
        display_phone_number: { type: string }
        verified_name: { type: string }
        status: { type: string }
        quality_rating: { type: string }
        country_code: { type: string }
        country_dial_code: { type: string }
        code_verification_status: { type: string }
        account_mode: { type: string }
        host_platform: { type: string }
        messaging_limit_tier: { type: string }
        is_official_business_account: { type: boolean }

    SetWebhookRequest:
      type: object
      required: [public_url]
      properties:
        public_url:
          type: string
          format: uri
          description: |
            Publicly-reachable https base URL (e.g. an ngrok tunnel URL)
            the provider will POST webhook deliveries to.

    WebhookConfig:
      type: object
      required: [webhook_url]
      description: |
        Outcome of a Set-webhook call: the fully-qualified provider
        webhook URL that was pushed to the provider, plus the verify
        token used.
      properties:
        webhook_url:
          type: string
          format: uri
        verify_token:
          type: string
          description: |
            Convenience — some provider consoles want the verify token
            pasted separately from the callback URL.

    NgrokTunnel:
      type: object
      required: [public_url]
      description: |
        Result of the ngrok tunnel discovery helper. Empty `public_url`
        means no tunnel was detected — the UI treats this as "paste the
        URL manually".
      properties:
        public_url:
          type: string
          description: The first https tunnel URL discovered on the local ngrok agent (empty when none).

    Problem:
      type: object
      description: RFC 7807 problem details.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: URI reference identifying the problem type.
          examples: ['https://nudgeway.dev/errors/validation']
        title:
          type: string
          examples: ['validation failed']
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
          examples: [400]
        detail:
          type: string
        instance:
          type: string
          format: uri
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

security:
  - sessionCookie: []
  - apiKey: []
