<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Help center · Nudgeway</title>
    <meta
      name="description"
      content="How to use Nudgeway — every module, every feature, every API. Setup, walkthroughs, and troubleshooting."
    />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://v-senthil.github.io/nudgeway/help.html" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nudgeway" />
    <meta property="og:title" content="Nudgeway help center" />
    <meta
      property="og:description"
      content="Structured docs for every Nudgeway module + REST API + MCP tool."
    />
    <meta property="og:url" content="https://v-senthil.github.io/nudgeway/help.html" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              waGreen: '#25D366',
              waTeal: '#128C7E',
              slateInk: '#0f172a',
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
              mono: ['JetBrains Mono', 'SFMono-Regular', 'Menlo', 'monospace'],
            },
          },
        },
      };
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Markdown + highlight -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/styles/github.min.css"
    />
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js"></script>

    <style>
      :root { color-scheme: light; }
      body { font-family: 'Inter', system-ui, sans-serif; }

      /* Prose-like styling for rendered markdown. Kept small — no
         dependency on @tailwindcss/typography. */
      .prose h1 {
        font-size: 2rem; font-weight: 800; letter-spacing: -0.01em;
        color: #0f172a; margin: 0 0 1rem;
      }
      .prose h2 {
        font-size: 1.35rem; font-weight: 700; color: #0f172a;
        margin: 2rem 0 0.75rem; padding-top: 0.5rem;
        border-top: 1px solid #e2e8f0;
      }
      .prose h3 {
        font-size: 1.05rem; font-weight: 600; color: #0f172a;
        margin: 1.25rem 0 0.5rem;
      }
      .prose p, .prose li { color: #334155; line-height: 1.7; }
      .prose p { margin: 0.5rem 0 1rem; }
      .prose a { color: #128c7e; text-decoration: underline; }
      .prose a:hover { color: #0f766e; }
      .prose ul, .prose ol { padding-left: 1.25rem; margin: 0.5rem 0 1rem; }
      .prose li { margin: 0.25rem 0; }
      .prose code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.875em;
        background: #f1f5f9; padding: 0.125rem 0.375rem;
        border-radius: 0.25rem; color: #0f172a;
      }
      .prose pre {
        background: #0f172a; color: #e2e8f0;
        border-radius: 0.5rem; padding: 1rem;
        overflow-x: auto; margin: 1rem 0;
        font-size: 0.85rem; line-height: 1.5;
      }
      .prose pre code {
        background: transparent; padding: 0; color: inherit;
        font-size: 0.85rem;
      }
      .prose blockquote {
        border-left: 3px solid #94a3b8; padding: 0.5rem 1rem;
        color: #475569; background: #f8fafc; margin: 1rem 0;
        border-radius: 0.25rem;
      }
      .prose table {
        border-collapse: collapse; width: 100%; margin: 1rem 0;
        font-size: 0.9rem;
      }
      .prose th, .prose td {
        border: 1px solid #e2e8f0; padding: 0.5rem 0.75rem; text-align: left;
      }
      .prose th { background: #f8fafc; font-weight: 600; }

      /* Module heading + page link styling in the TOC */
      .toc-module {
        font-size: 0.7rem; text-transform: uppercase;
        letter-spacing: 0.05em; color: #64748b;
        margin: 1rem 0.75rem 0.5rem; font-weight: 600;
      }
      .toc-link {
        display: block; padding: 0.375rem 0.75rem;
        border-radius: 0.375rem; color: #475569;
        font-size: 0.875rem; text-decoration: none;
        border-left: 2px solid transparent;
      }
      .toc-link:hover {
        background: #f1f5f9; color: #0f172a;
      }
      .toc-link.active {
        background: #ecfdf5; color: #0f766e; font-weight: 600;
        border-left-color: #10b981;
      }

      /* Search hit highlight */
      .toc-hit { background: #fef3c7; color: #92400e; }
    </style>
  </head>

  <body class="text-slateInk antialiased bg-slate-50">
    <!-- Top bar -->
    <header class="sticky top-0 z-30 flex items-center justify-between bg-white border-b border-slate-200 px-4 py-3">
      <div class="flex items-center gap-3">
        <a href="./" class="flex items-center gap-2 font-bold text-lg">
          <span class="inline-flex h-7 w-7 rounded-lg bg-gradient-to-br from-waGreen to-waTeal items-center justify-center text-white">
            <svg viewBox="0 0 24 24" fill="currentColor" class="h-4 w-4">
              <path
                d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v9A2.5 2.5 0 0 1 17.5 17H10l-4.2 3.4A.6.6 0 0 1 4.8 20V17H6.5A2.5 2.5 0 0 1 4 14.5v-9Z"
              />
            </svg>
          </span>
          Nudgeway
          <span class="text-slate-400 font-normal">·</span>
          <span class="font-medium text-slate-700">Help center</span>
        </a>
      </div>
      <nav class="hidden md:flex items-center gap-5 text-sm text-slate-600">
        <a href="./" class="hover:text-slateInk">Home</a>
        <a href="./api.html" class="hover:text-slateInk">API</a>
        <a href="https://github.com/v-senthil/nudgeway" class="hover:text-slateInk">GitHub</a>
      </nav>
    </header>

    <!-- Body: sidebar + main -->
    <div class="max-w-7xl mx-auto flex gap-8 px-4 py-6">
      <!-- Sidebar TOC -->
      <aside
        id="sidebar"
        class="w-72 shrink-0 sticky self-start top-[72px] max-h-[calc(100vh-96px)] overflow-y-auto bg-white border border-slate-200 rounded-xl p-3"
        aria-label="Help center table of contents"
      >
        <input
          id="tocSearch"
          type="search"
          placeholder="Filter…"
          class="w-full rounded-md border border-slate-300 px-3 py-1.5 text-sm placeholder:text-slate-400 focus:border-emerald-500 focus:outline-none focus:ring-1 focus:ring-emerald-500"
        />
        <nav id="toc" class="mt-2"></nav>
      </aside>

      <!-- Main content -->
      <main class="flex-1 min-w-0">
        <article
          id="content"
          class="prose bg-white border border-slate-200 rounded-xl p-8 shadow-sm min-h-[60vh]"
        >
          <p class="text-slate-500">Loading…</p>
        </article>

        <footer class="mt-6 text-xs text-slate-400 flex items-center justify-between">
          <span>
            Docs live in
            <a
              class="underline hover:text-slate-600"
              href="https://github.com/v-senthil/nudgeway/tree/main/docs/help"
            >
              <code>docs/help/</code>
            </a>. PRs welcome.
          </span>
          <a
            id="editLink"
            class="underline hover:text-slate-600"
            href="https://github.com/v-senthil/nudgeway/tree/main/docs/help"
            target="_blank"
            rel="noopener"
          >
            Edit this page
          </a>
        </footer>
      </main>
    </div>

    <script>
      const MANIFEST_URL = './help/manifest.json';
      const CONTENT_BASE = './help';
      const EDIT_BASE = 'https://github.com/v-senthil/nudgeway/edit/main/docs/help';

      let manifest = null;
      const contentCache = new Map();

      // --------------------------------------------------------- routing

      function currentRoute() {
        const raw = location.hash.startsWith('#/') ? location.hash.slice(2) : '';
        const [moduleId, pageId] = raw.split('/');
        return {
          moduleId: moduleId || (manifest && manifest.modules[0]?.id),
          pageId:
            pageId ||
            (moduleId && manifest?.modules.find((m) => m.id === moduleId)?.pages[0]?.id) ||
            manifest?.modules[0]?.pages[0]?.id,
        };
      }

      function routeUrl(moduleId, pageId) {
        return `#/${moduleId}/${pageId}`;
      }

      // ---------------------------------------------------------- TOC

      function renderTOC(filter) {
        const toc = document.getElementById('toc');
        toc.innerHTML = '';
        const active = currentRoute();
        const q = (filter || '').trim().toLowerCase();

        for (const mod of manifest.modules) {
          const matches = q
            ? mod.pages.filter(
                (p) =>
                  p.title.toLowerCase().includes(q) || mod.title.toLowerCase().includes(q),
              )
            : mod.pages;
          if (matches.length === 0) continue;

          const heading = document.createElement('div');
          heading.className = 'toc-module';
          heading.textContent = mod.title;
          toc.appendChild(heading);

          for (const page of matches) {
            const a = document.createElement('a');
            a.className = 'toc-link';
            a.href = routeUrl(mod.id, page.id);
            a.textContent = page.title;
            if (mod.id === active.moduleId && page.id === active.pageId) {
              a.classList.add('active');
            }
            toc.appendChild(a);
          }
        }
      }

      // ------------------------------------------------------- content

      async function fetchMarkdown(moduleId, pageId) {
        const path = `${CONTENT_BASE}/${moduleId}/${pageId}.md`;
        if (contentCache.has(path)) return contentCache.get(path);
        const res = await fetch(path);
        if (!res.ok) {
          throw new Error(`Failed to load ${path} — ${res.status}`);
        }
        const md = await res.text();
        contentCache.set(path, md);
        return md;
      }

      async function renderPage() {
        if (manifest === null) return;
        const { moduleId, pageId } = currentRoute();
        const content = document.getElementById('content');
        const editLink = document.getElementById('editLink');
        editLink.href = `${EDIT_BASE}/${moduleId}/${pageId}.md`;

        // Update page title.
        const mod = manifest.modules.find((m) => m.id === moduleId);
        const page = mod?.pages.find((p) => p.id === pageId);
        document.title = page
          ? `${page.title} · ${mod.title} · Nudgeway help`
          : 'Nudgeway help center';

        try {
          const md = await fetchMarkdown(moduleId, pageId);
          content.innerHTML = marked.parse(md);
          if (window.hljs) hljs.highlightAll();
          content.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } catch (err) {
          content.innerHTML = `
            <h1>Coming soon</h1>
            <p>This page hasn't landed yet — check back after the next docs pass, or open a PR at <a href="${EDIT_BASE}/${moduleId}/${pageId}.md">docs/help/${moduleId}/${pageId}.md</a>.</p>
            <p class="text-xs text-slate-400">Loader error: ${err.message}</p>
          `;
        }
        renderTOC(document.getElementById('tocSearch').value);
      }

      // ------------------------------------------------------ bootstrap

      async function boot() {
        try {
          const res = await fetch(MANIFEST_URL);
          manifest = await res.json();
          renderTOC('');
          renderPage();
        } catch (err) {
          document.getElementById('content').innerHTML = `
            <h1>Help center failed to load</h1>
            <p>Manifest fetch failed: ${err.message}</p>
          `;
        }
      }

      window.addEventListener('hashchange', renderPage);
      document.getElementById('tocSearch').addEventListener('input', (e) => {
        renderTOC(e.target.value);
      });
      boot();
    </script>

    <!-- GoatCounter -->
    <script
      data-goatcounter="https://nudgeway.goatcounter.com/count"
      async
      src="//gc.zgo.at/count.js"
    ></script>
  </body>
</html>
