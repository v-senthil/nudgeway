version: "2"
sql:
  - engine: mysql
    schema: migrations
    queries: internal/infrastructure/mysql/queries
    gen:
      go:
        package: gen
        out: internal/infrastructure/mysql/gen
        sql_package: database/sql
        emit_json_tags: true
        emit_interface: true
        emit_exact_table_names: false
        emit_prepared_queries: false
        emit_empty_slices: true
