# fragments/calls.yaml
# Self-contained OpenAPI 3.1 fragment for the calls REST surface. Kept as a
# fragment because the main openapi.yaml is owned by another agent this
# round; the fragment lands and gets merged in the follow-up wire-up
# commit.

openapi: 3.1.0
info:
  title: fullWA Calls API fragment
  version: 0.3.0-calls

paths:
  /api/v1/calls:
    get:
      operationId: listCalls
      summary: List calls for the caller's organization.
      tags: [calls]
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum:
              [
                queued,
                ringing,
                answered,
                in_progress,
                completed,
                missed,
                failed,
                declined,
                no_answer,
              ]
        - in: query
          name: direction
          schema: { type: string, enum: [inbound, outbound] }
        - in: query
          name: contact_id
          schema: { type: string }
        - in: query
          name: since
          schema: { type: string, format: date-time }
        - in: query
          name: until
          schema: { type: string, format: date-time }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: A page of calls newest-first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: initiateCall
      summary: Place a new outbound call.
      tags: [calls]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiateCallRequest'
      responses:
        '202':
          description: Accepted; call queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitiateCallAccepted'
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '424': { $ref: '#/components/responses/IntegrationMissing' }
        '502': { $ref: '#/components/responses/ProviderError' }

  /api/v1/calls/{id}:
    get:
      operationId: getCall
      summary: Fetch a single call.
      tags: [calls]
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Call'
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/calls/{id}/answer:
    post:
      operationId: answerCall
      summary: Accept an inbound call.
      tags: [calls]
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204': { description: Accepted. }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/ProviderError' }

  /api/v1/calls/{id}/reject:
    post:
      operationId: rejectCall
      summary: Reject an inbound call.
      tags: [calls]
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '204': { description: Rejected. }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/calls/{id}/end:
    post:
      operationId: endCall
      summary: Terminate an in-progress call.
      tags: [calls]
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204': { description: Terminated. }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/calls/{id}/recording:
    get:
      operationId: getCallRecording
      summary: Stream a call recording.
      tags: [calls]
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Audio bytes streamed from the provider.
          content:
            audio/ogg: {}
            audio/mp4: {}
            audio/wav: {}
            application/octet-stream: {}
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: fullwa_session

  responses:
    Unauthorized:
      description: Not authenticated.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: Authenticated but not permitted.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: Call not found.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Validation:
      description: Request failed shape validation.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    IntegrationMissing:
      description: Integration cannot be resolved to a live adapter.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    ProviderError:
      description: Upstream provider returned an error.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  schemas:
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        request_id: { type: string }

    RecordingOptions:
      type: object
      properties:
        enabled: { type: boolean }
        purpose: { type: string, maxLength: 250 }
        announcement_language: { type: string }

    TranscriptionOptions:
      type: object
      properties:
        enabled: { type: boolean }
        purpose: { type: string, maxLength: 250 }
        announcement_language: { type: string }

    InitiateCallRequest:
      type: object
      required: [integration_id]
      properties:
        integration_id: { type: string }
        to: { type: string }
        to_user_id: { type: string }
        contact_id: { type: string }
        idempotency_key: { type: string }
        recording: { $ref: '#/components/schemas/RecordingOptions' }
        transcription: { $ref: '#/components/schemas/TranscriptionOptions' }

    InitiateCallAccepted:
      type: object
      required: [call_id, status]
      properties:
        call_id: { type: string }
        status: { type: string }

    Call:
      type: object
      required: [id, org_id, provider, provider_call_id, direction, status, created_at]
      properties:
        id: { type: string }
        org_id: { type: string }
        integration_id: { type: string }
        business_endpoint_id: { type: string }
        contact_id: { type: string }
        session_id: { type: string }
        conversation_id: { type: string }
        provider: { type: string }
        provider_call_id: { type: string }
        direction: { type: string, enum: [inbound, outbound] }
        status:
          type: string
          enum:
            [
              queued,
              ringing,
              answered,
              in_progress,
              completed,
              missed,
              failed,
              declined,
              no_answer,
            ]
        from: { type: string }
        to: { type: string }
        from_user_id: { type: string }
        to_user_id: { type: string }
        started_at: { type: string, format: date-time }
        answered_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        duration_seconds: { type: integer }
        hangup_reason: { type: string }
        recording_url: { type: string }
        transcription_ref: { type: string }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CallList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Call' }
        next_cursor: { type: string }
