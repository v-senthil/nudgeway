# Template management — self-contained OpenAPI 3.1 fragment.
# The Phase 2 wire-up commit merges these paths + schemas into openapi.yaml.
# Every schema reference here uses the same #/components/schemas/* prefix
# as the parent so the merge is a straight paste.

paths:
  /api/v1/templates:
    get:
      tags: [templates]
      operationId: getTemplates
      summary: List message templates.
      description: |
        Returns the tenant's persisted templates, newest-updated first.
        Filter by integration + status. Cursor is opaque base64 — do not
        interpret or persist it beyond the immediate paging session.
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: integration_id
          required: false
          schema: { type: string }
        - in: query
          name: status
          required: false
          schema:
            $ref: '#/components/schemas/TemplateStatus'
        - in: query
          name: cursor
          required: false
          schema: { type: string }
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: A page of templates.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateList' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: Missing templates.read permission.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    post:
      tags: [templates]
      operationId: postTemplates
      summary: Create a template (draft or submit).
      description: |
        Persists a template locally in `DRAFT` state. When `submit=true`
        the service also calls the provider in the same request and
        advances the row to the provider-reported status
        (usually `PENDING`).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTemplateRequest' }
      responses:
        '201':
          description: Template persisted (and optionally submitted).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '400':
          description: Invalid request body.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: CSRF failure or missing templates.manage permission.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Validation error (missing body, unknown category, bad name).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '424':
          description: Target integration is missing.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/templates/{id}:
    get:
      tags: [templates]
      operationId: getTemplateByID
      summary: Fetch a single template.
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: Template ULID.
      responses:
        '200':
          description: The template.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: Missing templates.read permission.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Template not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [templates]
      operationId: deleteTemplate
      summary: Delete a local template row.
      description: |
        Removes the local mirror only. The provider mirror is untouched
        (a provider-side delete lands in Phase 3). Useful for abandoning
        an unsubmitted DRAFT.
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Template removed.
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: CSRF failure or missing templates.manage permission.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/templates/{id}/submit:
    post:
      tags: [templates]
      operationId: postTemplateSubmit
      summary: Submit a DRAFT template for provider review.
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Template submitted; body reflects the provider-reported state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: CSRF failure or missing templates.manage permission.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Template not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Template is not in DRAFT state.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '424':
          description: Target integration is missing.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '502':
          description: Provider rejected the submission.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/templates/sync:
    post:
      tags: [templates]
      operationId: postTemplatesSync
      summary: Reconcile the local template mirror with the provider.
      description: |
        Fetches every template from the provider for the supplied
        integration and upserts them into the local `templates` table.
        Local DRAFT rows the provider does not know about are left alone.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncTemplatesRequest' }
      responses:
        '200':
          description: Sync complete.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncTemplatesResponse' }
        '400':
          description: Missing integration_id.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: CSRF failure or missing templates.manage permission.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '424':
          description: Integration missing.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '502':
          description: Provider list call failed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

components:
  schemas:
    TemplateCategory:
      type: string
      enum: [MARKETING, UTILITY, AUTHENTICATION]

    TemplateStatus:
      type: string
      enum: [DRAFT, PENDING, APPROVED, REJECTED, PAUSED, DISABLED]

    TemplateComponent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          description: HEADER, BODY, FOOTER, BUTTONS, CAROUSEL, ...
        format:
          type: string
          description: Header format when type=HEADER (TEXT, IMAGE, VIDEO, DOCUMENT, LOCATION).
        text:
          type: string
        example:
          type: object
          additionalProperties: true
        buttons:
          type: array
          items:
            type: object
            additionalProperties: true
        cards:
          type: array
          items:
            type: object
            additionalProperties: true
        extra:
          type: object
          additionalProperties: true

    Template:
      type: object
      required: [id, org_id, integration_id, name, language, category, status, components, variables, created_at, updated_at]
      properties:
        id: { type: string }
        org_id: { type: string }
        integration_id: { type: string }
        provider_template_id: { type: string }
        name: { type: string }
        language: { type: string }
        category: { $ref: '#/components/schemas/TemplateCategory' }
        status: { $ref: '#/components/schemas/TemplateStatus' }
        components:
          type: array
          items: { $ref: '#/components/schemas/TemplateComponent' }
        variables:
          type: object
          additionalProperties: { type: string }
        last_synced_at:
          type: string
          format: date-time
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TemplateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Template' }
        next_cursor: { type: string }

    CreateTemplateRequest:
      type: object
      required: [integration_id, name, language, category, components]
      properties:
        integration_id: { type: string }
        name:
          type: string
          description: Lowercase alphanumeric + underscore; 1-512 chars.
        language: { type: string }
        category: { $ref: '#/components/schemas/TemplateCategory' }
        components:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/TemplateComponent' }
        submit:
          type: boolean
          default: false
          description: When true, submit to the provider in the same request.
        allow_category_change:
          type: boolean
          default: false

    SyncTemplatesRequest:
      type: object
      required: [integration_id]
      properties:
        integration_id: { type: string }

    SyncTemplatesResponse:
      type: object
      required: [fetched, upserted]
      properties:
        fetched: { type: integer }
        upserted: { type: integer }
