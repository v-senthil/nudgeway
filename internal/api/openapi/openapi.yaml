openapi: 3.1.0
info:
  title: Nudgeway API
  version: 0.2.5-phase2
  summary: Multi-tenant customer communication platform API.
  description: |
    Every request is scoped to an organization determined from the
    authenticated principal (session cookie or API key). Errors follow
    RFC 7807 (`application/problem+json`).
  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://localhost:8080
    description: local dev

tags:
  - name: system
    description: Health and readiness probes.
  - name: auth
    description: Session lifecycle.
  - name: contacts
    description: Contact CRUD and 360.
  - name: conversations
    description: Conversation list, thread, assignment.
  - name: messages
    description: Send and read messages.
  - name: integrations
    description: Provider integrations (WhatsApp, Zoho, …).
  - name: webhooks
    description: Provider webhook ingress endpoints.
  - name: provider-calls
    description: Operator-facing execution log of every outbound HTTP call the provider adapters make.
  - name: audit
    description: Append-only audit trail of tenant mutations.
  - name: api-tokens
    description: Long-lived programmatic-access tokens for MCP / CI / scripts.

paths:
  /healthz:
    get:
      tags: [system]
      operationId: getHealthz
      summary: Liveness probe.
      description: Returns 200 as long as the process is alive.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
        '500':
          description: Internal error
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /readyz:
    get:
      tags: [system]
      operationId: getReadyz
      summary: Readiness probe.
      description: |
        Returns 200 only when downstream dependencies (MySQL, Redis, HBase)
        are reachable. Returns 503 otherwise.
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
        '503':
          description: Not ready
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/auth/csrf:
    get:
      tags: [auth]
      operationId: getAuthCsrf
      summary: Issue a CSRF cookie.
      description: |
        Sets a fresh `nudgeway_csrf` cookie so the caller can echo the token in
        the `X-CSRF-Token` header on subsequent state-changing requests
        (double-submit cookie pattern). No session required.
      security: []
      responses:
        '204':
          description: Cookie issued.
        '500':
          description: Internal error
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: postAuthLogin
      summary: Log in with email + password.
      description: |
        Authenticates the caller against MySQL-backed users, issues a session
        cookie (`nudgeway_session`) and a fresh CSRF cookie (`nudgeway_csrf`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: Invalid credentials
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: postAuthLogout
      summary: Invalidate the current session.
      description: |
        Deletes the session server-side and clears the session + CSRF cookies.
        Requires a valid session and matching CSRF token.
      responses:
        '204':
          description: Logged out.
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: CSRF failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /webhooks/{provider}/{integration_id}:
    parameters:
      - name: provider
        in: path
        required: true
        description: |
          Registry key of the target provider (e.g. `whatsapp`). Must match
          the `provider` column of the integration row identified by
          `integration_id`; a mismatch returns 404.
        schema:
          type: string
          examples: ['whatsapp']
      - name: integration_id
        in: path
        required: true
        description: ULID of the target Integration row.
        schema:
          type: string
    get:
      tags: [webhooks]
      operationId: getWebhookVerify
      summary: Provider subscription verification handshake.
      description: |
        Meta's WhatsApp Cloud API (and other providers following the same
        pattern) issue a `GET` with `hub.mode=subscribe`,
        `hub.verify_token=<shared secret>`, and `hub.challenge=<nonce>` when
        the tenant registers their webhook URL. The server echoes
        `hub.challenge` verbatim as `text/plain` on a matching verify
        token, and returns 403 otherwise.

        Unauthenticated at the HTTP layer — no session cookie or CSRF token
        is required. The `verify_token` shared secret proves the caller
        possesses configuration the tenant provided to the provider.
      security: []
      parameters:
        - name: hub.mode
          in: query
          required: true
          description: Must equal `subscribe`.
          schema:
            type: string
            examples: ['subscribe']
        - name: hub.verify_token
          in: query
          required: true
          description: Shared secret configured on the Integration.
          schema:
            type: string
        - name: hub.challenge
          in: query
          required: true
          description: Random nonce the provider expects echoed back on success.
          schema:
            type: string
      responses:
        '200':
          description: Verify token matched; challenge echoed.
          content:
            text/plain:
              schema:
                type: string
                examples: ['1580694962']
        '403':
          description: Verify token mismatch, unknown integration, or bad hub.mode.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    post:
      tags: [webhooks]
      operationId: postWebhookIngress
      summary: Provider webhook ingress.
      description: |
        Provider-agnostic webhook receiver. The request body MUST be the
        exact bytes the provider signed (do not re-serialise); signature
        verification is performed on the raw body against the per-provider
        shared secret configured on the Integration before any parsing.

        Unauthenticated at the HTTP layer — external providers cannot
        present our session cookie or CSRF token. Authenticity is enforced
        via signature verification inside the ingress helper (e.g. Meta's
        `X-Hub-Signature-256` HMAC-SHA256 over the raw body).

        Idempotency is enforced by a UNIQUE index on
        `webhook_events(integration_id, external_event_id)`; duplicate
        deliveries return 200 without re-enqueuing. The raw body is
        persisted before the 200 ACK so replay + debugging never require
        re-fetching from the provider.

        Body size is capped at 1 MiB; larger requests return 413.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Provider-specific payload; see docs/providers/*.md.
      responses:
        '200':
          description: |
            Delivery accepted (or a duplicate replay absorbed). Empty body;
            providers expect a fast ACK.
        '401':
          description: Signature verification failed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Unknown integration, or provider does not match the integration row.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413':
          description: Body exceeds the 1 MiB cap.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500':
          description: Internal error persisting the delivery.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getAuthMe
      summary: Return the current principal.
      description: Returns the authenticated user, its org, and permission set.
      responses:
        '200':
          description: The current principal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/integrations:
    get:
      tags: [integrations]
      operationId: listIntegrations
      summary: List all integrations for the current org.
      description: |
        Returns every Integration owned by the caller's organization.
        Requires the `integrations.manage` permission. Secret credential
        material is never included in the response.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The current integrations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationList' }
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: Missing integrations.manage permission
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    post:
      tags: [integrations]
      operationId: createIntegration
      summary: Create a new integration.
      description: |
        Validates the provided config + secrets against the target
        provider's schema, envelope-encrypts the secrets, and inserts a
        matching business endpoint row. For channel-kind providers
        (WhatsApp), the response's `webhook_url` is the URL the operator
        pastes into the provider console. Requires the
        `integrations.manage` permission and a matching CSRF token.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIntegrationRequest' }
      responses:
        '201':
          description: Integration created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Integration' }
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: CSRF failure or missing integrations.manage permission
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Validation failure (missing config keys, unknown provider, ...)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/integrations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Integration ULID.
    get:
      tags: [integrations]
      operationId: getIntegration
      summary: Fetch one integration by id.
      description: Requires the `integrations.manage` permission. Secrets are stripped.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The integration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Integration' }
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: Missing integrations.manage permission
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [integrations]
      operationId: deleteIntegration
      summary: Soft-disconnect an integration.
      description: |
        Flips the integration's status to `disconnected` so downstream
        workers stop picking it up. The row and encrypted credentials
        remain in the audit trail for Phase 4. Requires CSRF and
        `integrations.manage`.
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Disconnected.
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: CSRF failure or missing integrations.manage permission
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/integrations/{id}/test:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Integration ULID.
    post:
      tags: [integrations]
      operationId: testIntegration
      summary: Test an integration's connection.
      description: |
        Resolves the provider adapter for the integration, runs
        `HealthCheck`, updates the integration's `Status` + `Health`
        fields, and returns the outcome. Requires CSRF and
        `integrations.manage`.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Health-check outcome.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestIntegrationResponse' }
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: CSRF failure or missing integrations.manage permission
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/messages:
    post:
      tags: [messages]
      operationId: postMessagesSend
      summary: Enqueue an outbound message.
      description: |
        Persists the message as `queued`, enqueues a job on the
        `message.send` lane, and returns 202. The provider adapter is
        invoked asynchronously by the send worker; status transitions
        (`sent`, `delivered`, `read`, `failed`) arrive later via
        `MessageSent` / `MessageDelivered` / `MessageRead` / `MessageFailed`
        events and provider status webhooks.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
      responses:
        '202':
          description: Message queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendMessageAccepted' }
        '400':
          description: Invalid request body.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: CSRF failure or missing permission.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Conversation not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '424':
          description: The conversation has no configured integration.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/attachments:
    post:
      tags: [messages]
      operationId: postAttachmentsUpload
      summary: Upload a media attachment.
      description: |
        Accepts a single `file` field via `multipart/form-data`, streams it
        into the content-addressed attachments store, and returns the
        externally-reachable `media_url` the caller can hand back on a
        subsequent `POST /api/v1/messages` under `media.url` for
        image/video/audio/document/sticker types. Maximum size is 16 MiB;
        larger blobs require the resumable upload API (not yet supported).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The media asset to upload.
      responses:
        '201':
          description: Attachment stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentUploadResponse' }
        '400':
          description: Missing or malformed multipart body.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: CSRF failure.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413':
          description: Attachment exceeds 16 MiB cap.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/media/{key}:
    get:
      tags: [messages]
      operationId: getMedia
      summary: Stream a stored media blob.
      description: |
        Serves the bytes for a media attachment keyed by SHA-256 hex. The
        key is the same string surfaced on `Message.media_url` for inbound
        messages once the ingress pipeline has downloaded them, and on
        `AttachmentUploadResponse.attachment_id` for outbound uploads.
        Auth-gated; the response is `private, max-age=86400`.
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: key
          required: true
          schema: { type: string }
          description: Content-addressed SHA-256 hex (64 chars).
      responses:
        '200':
          description: The blob bytes with the persisted Content-Type.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Unknown media key.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    head:
      tags: [messages]
      operationId: headMedia
      summary: Fetch headers for a stored media blob.
      description: |
        Same semantics as `GET /api/v1/media/{key}` but returns only
        headers — useful for prefetching Content-Type or verifying the
        blob's existence without pulling the payload.
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: key
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Blob exists.
        '401':
          description: Not authenticated.
        '404':
          description: Unknown media key.

  /api/v1/conversations:
    get:
      tags: [conversations]
      operationId: getConversations
      summary: List conversations for the caller's org.
      description: |
        Phase 1 placeholder — returns an empty list. Replaced with the full
        list implementation in Phase 1 Task 4.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: A (possibly empty) page of conversations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationList' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/messages/{id}/read:
    post:
      tags: [messages]
      operationId: postMessageMarkRead
      summary: Mark a single inbound message as read to the provider.
      description: |
        Calls the channel adapter's mark-as-read API (Meta shows the blue
        double-tick on the customer's phone) and stamps `read_at` locally.
        Idempotent — outbound messages, messages without a
        `provider_message_id`, and messages already stamped as read return
        204 without side-effects.
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: Message ULID.
      responses:
        '204':
          description: Mark-as-read accepted.
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: CSRF failure.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Message not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '424':
          description: The message's integration cannot be resolved.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '502':
          description: The upstream provider rejected the mark-as-read call.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/conversations/{id}/read:
    post:
      tags: [conversations]
      operationId: postConversationMarkRead
      summary: Mark the newest unread inbound messages in a conversation as read.
      description: |
        Batch variant of `POST /api/v1/messages/{id}/read`. Iterates over
        the newest 50 messages in the conversation and calls the provider's
        mark-as-read for every inbound row with a `provider_message_id`
        that is not already stamped `read_at`. Partial failures are
        recorded server-side; the caller can retry.
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: Conversation ULID.
      responses:
        '204':
          description: Batch mark-as-read accepted.
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: CSRF failure.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '502':
          description: Upstream provider rejected one or more calls.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/conversations/{id}/messages:
    get:
      tags: [messages]
      operationId: getConversationMessages
      summary: List messages in a conversation, newest first.
      description: |
        Cursor-based pagination. The `next_cursor` returned in the response
        should be echoed back as the `cursor` query parameter on the next
        page. Absent `next_cursor` means the caller reached the end.
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: Conversation ULID.
        - in: query
          name: cursor
          required: false
          schema: { type: string }
          description: Opaque cursor returned by a prior page.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: A page of messages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageList' }
        '400':
          description: Bad request.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/audit-logs:
    get:
      tags: [audit]
      operationId: getAuditLogs
      summary: List audit trail entries for the current org.
      description: |
        Returns append-only audit log rows newest-first, filtered by any
        combination of `resource_type`, `resource_id`, `action`,
        `actor_user_id`, `since`, and `until`. Requires the
        `audit.read` permission. Pagination uses an opaque `cursor` echoed
        from the previous response's `next_cursor`; absent `next_cursor`
        means the caller reached the end.
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: resource_type
          required: false
          schema: { type: string }
          description: Filter by resource kind (integration, message, conversation, attachment, session).
        - in: query
          name: resource_id
          required: false
          schema: { type: string }
          description: Filter by resource identifier. Requires resource_type to hit the composite index.
        - in: query
          name: action
          required: false
          schema: { type: string }
          description: Filter by verb (e.g. integration.created, message.sent).
        - in: query
          name: actor_user_id
          required: false
          schema: { type: string }
          description: Filter by the ULID of the operator who performed the action.
        - in: query
          name: since
          required: false
          schema: { type: string, format: date-time }
          description: Include entries with occurred_at >= this timestamp (RFC3339).
        - in: query
          name: until
          required: false
          schema: { type: string, format: date-time }
          description: Include entries with occurred_at < this timestamp (RFC3339).
        - in: query
          name: cursor
          required: false
          schema: { type: string }
          description: Opaque cursor returned by a prior page.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: A page of audit log entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogList' }
        '400':
          description: Bad request — invalid filter or cursor.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: Missing audit.read permission.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/provider-calls:
    get:
      tags: [provider-calls]
      operationId: listProviderCalls
      summary: List Meta / provider execution log entries.
      description: |
        Returns the operator-facing execution log of every outbound HTTP
        call the provider adapters made to a third-party API, newest-first.
        This is the canonical debugging surface — every WhatsApp send /
        media / template call is recorded here, along with its request
        body, response body, status code, latency, and error class.

        Filter by any combination of `integration_id`, `operation`
        (`send_message`, `mark_as_read`, `get_media_url`, `download_media`,
        `list_templates`, `create_template`, `get_template_status`,
        `upload_media`), `status_min` / `status_max` (bounds the HTTP
        status code), `since` / `until` (RFC 3339 timestamps).

        Pagination is cursor-based; echo `next_cursor` back as `cursor` on
        the next call. Absent `next_cursor` means the caller reached the
        end. Requires the `integrations.manage` permission (read + manage
        share the same key today).
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: integration_id
          required: false
          schema: { type: string }
          description: Filter to a single integration ULID.
        - in: query
          name: operation
          required: false
          schema: { type: string }
          description: Filter by adapter operation name.
        - in: query
          name: status_min
          required: false
          schema: { type: integer, minimum: 0, maximum: 599 }
          description: Lower bound (inclusive) on HTTP status code.
        - in: query
          name: status_max
          required: false
          schema: { type: integer, minimum: 0, maximum: 599 }
          description: Upper bound (inclusive) on HTTP status code.
        - in: query
          name: since
          required: false
          schema: { type: string, format: date-time }
          description: Only rows at or after this timestamp.
        - in: query
          name: until
          required: false
          schema: { type: string, format: date-time }
          description: Only rows strictly before this timestamp.
        - in: query
          name: cursor
          required: false
          schema: { type: string }
          description: Opaque cursor from the previous response's next_cursor.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: A page of provider-call entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderCallList' }
        '400':
          description: Bad request (invalid cursor / filter).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: Missing integrations.manage permission.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/api-tokens:
    get:
      tags: [api-tokens]
      operationId: listAPITokens
      summary: List API tokens for the current organization.
      description: |
        Returns every long-lived API token owned by the caller's org,
        newest-first. Revoked tokens are included — the UI badges them
        separately. The plaintext secret is NEVER returned; only the
        indexed prefix and metadata.
      security:
        - sessionCookie: []
        - apiKey: []
      responses:
        '200':
          description: A list of API tokens.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/APITokenList' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    post:
      tags: [api-tokens]
      operationId: createAPIToken
      summary: Mint a new API token.
      description: |
        Creates a long-lived API token bound to the caller's (org, user).
        The `plaintext` field of the response is the ONLY time the full
        token (`nk_<prefix>_<secret>`) is ever returned — store it
        immediately in a password manager or secret vault. Only the
        prefix and an argon2id hash of the secret are persisted server-
        side; losing the plaintext requires minting a replacement.
      security:
        - sessionCookie: []
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAPITokenRequest' }
      responses:
        '201':
          description: Token minted. Response contains the plaintext (shown once).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateAPITokenResponse' }
        '400':
          description: Malformed request body.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Validation failed (name required, name too long, bad expiry).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/api-tokens/{id}/usage:
    get:
      tags: [api-tokens]
      operationId: getAPITokenUsage
      summary: List per-request execution-log rows for one API token.
      description: |
        Returns the operator-facing execution log of every bearer-
        authenticated request served with this token, newest-first.
        Every entry captures method, path, status, latency, remote IP,
        user-agent, request + response bodies (capped at 8KB and JSON-
        redacted for known secret keys), and true wire sizes.

        Pagination is cursor-based; echo `next_cursor` back as `cursor`
        on the next call. Absent `next_cursor` means the caller reached
        the end. Callers see only rows owned by their own org — the
        repo scopes every query on org_id.
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: ULID of the api_tokens row.
        - in: query
          name: since
          required: false
          schema: { type: string, format: date-time }
          description: Only rows at or after this timestamp.
        - in: query
          name: until
          required: false
          schema: { type: string, format: date-time }
          description: Only rows strictly before this timestamp.
        - in: query
          name: status_min
          required: false
          schema: { type: integer, minimum: 0, maximum: 599 }
          description: Lower bound (inclusive) on HTTP status code.
        - in: query
          name: status_max
          required: false
          schema: { type: integer, minimum: 0, maximum: 599 }
          description: Upper bound (inclusive) on HTTP status code.
        - in: query
          name: cursor
          required: false
          schema: { type: string }
          description: Opaque cursor from the previous response's next_cursor.
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: A page of usage entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/APITokenUsageList' }
        '400':
          description: Bad request (invalid cursor / filter).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/api-tokens/{id}/metrics:
    get:
      tags: [api-tokens]
      operationId: getAPITokenMetrics
      summary: Aggregate KPIs + per-day series for one API token.
      description: |
        Returns aggregate counters (total requests, error count, average
        latency, bytes in/out), a per-day series drawn from the
        api_token_usage_daily rollup, a per-status-code histogram, and
        the top-10 hit paths for the token over the requested window.
        Default window is the last 30 days when `since` / `until` are
        omitted.
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: ULID of the api_tokens row.
        - in: query
          name: since
          required: false
          schema: { type: string, format: date-time }
        - in: query
          name: until
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Aggregate metrics for the token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/APITokenMetrics' }
        '400':
          description: Bad request (invalid since/until).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/api-tokens/{id}:
    delete:
      tags: [api-tokens]
      operationId: revokeAPIToken
      summary: Revoke an API token.
      description: |
        Marks the token as revoked. Subsequent bearer requests presenting
        this token are rejected as unauthenticated. Idempotent — revoking
        an already-revoked token succeeds.
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: ULID of the api_tokens row to revoke.
      responses:
        '204':
          description: Revoked.
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No matching token in the caller's org.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: nudgeway_session
      description: Signed session cookie.
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Programmatic access with per-org scoped key.

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          examples: ['ok', 'ready']

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          examples: ['admin@example.com']
        password:
          type: string
          format: password
          minLength: 1

    LoginResponse:
      type: object
      required: [user_id, org_id, permissions, expires_at]
      properties:
        user_id:
          type: string
          description: ULID of the authenticated user.
        org_id:
          type: string
          description: ULID of the user's organization.
        permissions:
          type: array
          items: { type: string }
          description: Permission keys granted to the user in this org.
        expires_at:
          type: string
          format: date-time

    Me:
      type: object
      required: [user_id, org_id, org_name, email, display_name, permissions]
      properties:
        user_id: { type: string }
        org_id: { type: string }
        org_name: { type: string }
        email: { type: string, format: email }
        display_name: { type: string }
        permissions:
          type: array
          items: { type: string }

    SendMessageRequest:
      type: object
      required: [conversation_id, type]
      description: |
        Payload for POST /api/v1/messages. `type` selects the canonical
        message shape; the corresponding sub-object (`text`, `template`,
        `media`, `interactive`, `location`, `reaction`) must be populated.
        Everything is provider-neutral — the channel adapter interprets it.
      properties:
        conversation_id:
          type: string
          description: ULID of the target conversation.
        type:
          type: string
          enum: [text, template, image, video, audio, document, sticker, interactive, location, reaction]
        text:
          type: object
          description: Present when type=text.
          required: [body]
          properties:
            body: { type: string }
            preview_url: { type: boolean }
        template:
          type: object
          description: Present when type=template.
          required: [name, language]
          properties:
            name: { type: string }
            language: { type: string, description: 'BCP47 or Meta locale.' }
            namespace: { type: string }
            components:
              type: array
              items:
                type: object
        media:
          type: object
          description: Present when type is one of image/video/audio/document/sticker.
          properties:
            kind: { type: string }
            media_id: { type: string }
            url: { type: string, format: uri }
            mime_type: { type: string }
            caption: { type: string }
            file_name: { type: string }
        interactive:
          type: object
          description: Present when type=interactive; forwarded verbatim.
        location:
          type: object
          description: Present when type=location.
          required: [latitude, longitude]
          properties:
            latitude: { type: number, format: double }
            longitude: { type: number, format: double }
            name: { type: string }
            address: { type: string }
        reaction:
          type: object
          description: Present when type=reaction.
          required: [message_id]
          properties:
            message_id: { type: string }
            emoji: { type: string }
        idempotency_key:
          type: string
          description: |
            Optional client-supplied key echoed to the provider (e.g. Meta's
            `biz_opaque_callback_data`). When absent the server uses the
            message ID.

    AttachmentUploadResponse:
      type: object
      required: [attachment_id, media_url, size, content_type]
      description: |
        Result of POST /api/v1/attachments. `attachment_id` is the
        content-addressed SHA-256 key; `media_url` is the fully-qualified
        URL the send worker hands to the provider under `media.url`.
      properties:
        attachment_id: { type: string }
        media_url: { type: string, format: uri }
        size: { type: integer, format: int64 }
        content_type: { type: string }
        filename: { type: string }

    SendMessageAccepted:
      type: object
      required: [message_id, status]
      properties:
        message_id:
          type: string
          description: ULID of the newly-created message row.
        status:
          type: string
          enum: [queued]

    Message:
      type: object
      required:
        - id
        - conversation_id
        - session_id
        - contact_id
        - channel
        - provider
        - direction
        - type
        - status
        - sender
        - recipient
        - created_at
      properties:
        id: { type: string }
        conversation_id: { type: string }
        session_id: { type: string }
        contact_id: { type: string }
        channel: { type: string }
        provider: { type: string }
        direction:
          type: string
          enum: [inbound, outbound]
        type: { type: string }
        status:
          type: string
          enum: [queued, sent, delivered, read, failed]
        sender: { type: string }
        recipient: { type: string }
        provider_message_id: { type: string }
        text: { type: string }
        media_url:
          type: string
          format: uri
          description: |
            Same-origin URL to fetch the media bytes. When the ingress
            pipeline has downloaded the provider's copy this is
            `/api/v1/media/{key}`; otherwise it may be a short-lived
            provider-native URL (Meta CDN, etc.).
        content_type:
          type: string
          description: MIME type persisted alongside the media bytes.
        location:
          type: object
          description: |
            Populated when `type == "location"`. Latitude/longitude are
            always present; name/address/url are optional.
          properties:
            latitude: { type: number, format: double }
            longitude: { type: number, format: double }
            name: { type: string }
            address: { type: string }
            url: { type: string, format: uri }
        contacts:
          type: array
          description: Populated when `type == "contacts"`. One entry per shared vCard.
          items:
            type: object
            properties:
              name: { type: string }
              phones:
                type: array
                items: { type: string }
              emails:
                type: array
                items: { type: string, format: email }
        reaction:
          type: object
          description: |
            Populated when `type == "reaction"`. `message_id` is the
            provider-native id (e.g. wamid) of the reacted-to message.
            Empty `emoji` means the reaction was removed.
          properties:
            emoji: { type: string }
            message_id: { type: string }
        interactive:
          type: object
          description: |
            Populated when `type == "interactive"` (or `type == "button"` for
            template quick replies). Kind mirrors Meta's discriminator —
            `button_reply`, `list_reply`, `button`, `cta_url`, `flow`, …
          properties:
            kind: { type: string }
            id: { type: string }
            title: { type: string }
            description: { type: string }
        reply_to_provider_message_id:
          type: string
          description: |
            Provider-native id (e.g. wamid) of the message this one replies
            to. Frontends use it to attach reactions to the referenced
            bubble or render a "replying to" chip.
        created_at: { type: string, format: date-time }
        sent_at: { type: string, format: date-time }
        delivered_at: { type: string, format: date-time }
        read_at: { type: string, format: date-time }

    MessageList:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        next_cursor:
          type: string
          description: Opaque cursor for the next page; absent when done.

    Conversation:
      type: object
      required: [id, status, created_at]
      properties:
        id: { type: string }
        session_id: { type: string }
        contact_id: { type: string }
        status:
          type: string
          enum: [open, pending, resolved, reopened]
        assigned_user_id: { type: string }
        assigned_team_id: { type: string }
        priority:
          type: string
          enum: [low, normal, high, urgent]
        unread_count: { type: integer }
        last_message_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    ConversationList:
      type: object
      required: [conversations]
      properties:
        conversations:
          type: array
          items: { $ref: '#/components/schemas/Conversation' }
        next_cursor:
          type: string
          description: Opaque cursor for the next page; absent when done.

    Integration:
      type: object
      description: |
        A provider integration owned by the current organization.
        Credential material is NEVER included in this schema; the
        `webhook_url` is the tenant-facing URL for provider consoles.
      required: [id, org_id, type, provider, name, status, config, capabilities, created_at, updated_at]
      properties:
        id: { type: string }
        org_id: { type: string }
        type:
          type: string
          enum: [channel, ticketing, bot, ai, calling]
        provider:
          type: string
          examples: ['whatsapp', 'zoho_desk']
        name: { type: string }
        status:
          type: string
          enum: [connected, disconnected, degraded, auth_failed, rate_limited]
        config:
          type: object
          additionalProperties: true
          description: Non-secret provider configuration. Never contains credentials.
        capabilities:
          type: object
          additionalProperties: { type: boolean }
        health:
          type: object
          additionalProperties: true
        webhook_url:
          type: string
          description: URL to paste into the provider's webhook console.
          examples: ['https://app.example.com/webhooks/whatsapp/01H…']
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    IntegrationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Integration' }

    CreateIntegrationRequest:
      type: object
      required: [provider, name, config, secrets]
      properties:
        type:
          type: string
          enum: [channel, ticketing, bot, ai, calling]
          description: Optional; validated against the provider's registered kind.
        provider:
          type: string
          examples: ['whatsapp']
        name:
          type: string
          examples: ['Acme Support Line']
        config:
          type: object
          additionalProperties: true
          description: |
            Non-secret provider configuration. For WhatsApp:
            `phone_number_id`, `waba_id`.
        secrets:
          type: object
          additionalProperties: { type: string }
          description: |
            Envelope-encrypted at rest; never returned in any response.
            For WhatsApp: `access_token`, `app_secret`, `verify_token`.

    TestIntegrationResponse:
      type: object
      required: [ok, message, checked_at]
      properties:
        ok: { type: boolean }
        message: { type: string }
        checked_at: { type: string, format: date-time }

    AuditLog:
      type: object
      description: |
        A single append-only entry in the tenant audit trail. Written from
        every mutation path (integration lifecycle, message send / read,
        attachment upload, login / logout). Metadata is a free-form
        JSON object interpreted by the emitting caller.
      required: [id, org_id, action, resource_type, occurred_at]
      properties:
        id:
          type: string
          description: BIGINT primary key rendered as a decimal string.
        org_id:
          type: string
          description: Owning tenant ULID.
        actor_user_id:
          type: string
          description: Operator ULID. Empty for system-driven actions.
        action:
          type: string
          description: Verb identifying the mutation.
          examples: ['integration.created', 'message.sent', 'user.logged_in']
        resource_type:
          type: string
          examples: ['integration', 'message', 'conversation', 'attachment', 'session']
        resource_id:
          type: string
          description: Affected entity identifier; empty for bulk actions.
        ip:
          type: string
          description: Client IP address (IPv4 dotted or IPv6).
        metadata:
          type: object
          additionalProperties: true
        occurred_at:
          type: string
          format: date-time

    AuditLogList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditLog' }
        next_cursor:
          type: string
          description: Opaque continuation token; absent when the caller reached the end.

    AuditLogFilter:
      type: object
      description: |
        Reified filter shape mirroring the GET /audit-logs query
        parameters. Present as a schema so codegen surfaces a strongly
        typed builder for the frontend hook.
      properties:
        resource_type: { type: string }
        resource_id: { type: string }
        action: { type: string }
        actor_user_id: { type: string }
        since: { type: string, format: date-time }
        until: { type: string, format: date-time }
        cursor: { type: string }
        limit:
          type: integer
          minimum: 1
          maximum: 200

    ProviderCall:
      type: object
      description: |
        One entry in the operator-facing execution log — the record of a
        single outbound HTTP call the provider adapters made to a
        third-party API.
      required: [id, org_id, provider, operation, direction, method, url, status_code, latency_ms, occurred_at]
      properties:
        id:
          type: integer
          format: int64
          description: Internal auto-increment identifier.
        org_id:
          type: string
          description: Tenant ULID.
        integration_id:
          type: string
          description: Owning integration ULID. Absent when a very-early failure prevented the integration row from being loaded.
        provider:
          type: string
          description: Registry key of the calling adapter (e.g. `whatsapp`).
        operation:
          type: string
          description: |
            Adapter operation name — one of `send_message`, `mark_as_read`,
            `get_media_url`, `download_media`, `list_templates`,
            `create_template`, `get_template_status`, `upload_media`.
        direction:
          type: string
          enum: [outbound, inbound]
          description: Only `outbound` is written today.
        method:
          type: string
          description: HTTP verb.
        url:
          type: string
          description: Fully-qualified request URL (no secrets).
        status_code:
          type: integer
          description: HTTP status. Zero when the request never completed.
        latency_ms:
          type: integer
          format: int64
          description: Wall-clock duration of the request in milliseconds.
        request_body:
          type: string
          description: Base64-encoded request body (truncated at 64 KiB). Empty for GETs.
        response_body:
          type: string
          description: Base64-encoded response body (truncated at 64 KiB). Empty for `download_media`.
        request_body_text:
          type: string
          description: Best-effort UTF-8 rendering of the request body — populated when the bytes are probably text (e.g. JSON).
        response_body_text:
          type: string
          description: Best-effort UTF-8 rendering of the response body.
        error_class:
          type: string
          description: Failure classification (`transient`, `rate_limited`, `auth`, `permanent`, `unknown`). Empty on success.
        error_message:
          type: string
          description: Short human-readable failure message.
        trace_id:
          type: string
          description: Provider trace identifier (Meta's `fbtrace_id`).
        correlation_id:
          type: string
          description: Correlation ID stitching the entry to the originating request / job.
        occurred_at:
          type: string
          format: date-time

    ProviderCallList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProviderCall' }
        next_cursor:
          type: string
          description: Opaque token to echo back as `cursor` on the next request; absent when the caller reached the end.

    APIToken:
      type: object
      description: Safe list-view projection of an API token. NEVER includes plaintext or hash.
      required: [id, name, prefix, created_at]
      properties:
        id:
          type: string
          description: ULID of the api_tokens row.
        name:
          type: string
          description: Human-friendly label, chosen by the caller at create time.
          maxLength: 120
        prefix:
          type: string
          description: 8-character plaintext prefix, safe to log. Uniquely identifies the token in listings.
          minLength: 8
          maxLength: 8
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the most recent successful bearer verify. Best-effort — updated asynchronously.
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Optional expiry — after this instant the token is rejected as invalid.
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: When set, the token is permanently invalid.

    APITokenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/APIToken' }

    CreateAPITokenRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Human-friendly label (e.g. "mcp server local", "gh actions ci").
        expires_in_days:
          type: integer
          minimum: 1
          nullable: true
          description: Optional expiry, expressed in days from creation. Omit for a non-expiring token.

    CreateAPITokenResponse:
      type: object
      description: |
        The `plaintext` field is the FULL token (`nk_<prefix>_<secret>`) and
        is returned exactly once — at creation time. It is never persisted
        server-side; only the prefix and an argon2id hash of the secret are
        stored.
      required: [id, name, prefix, plaintext, created_at]
      properties:
        id:
          type: string
          description: ULID of the newly-minted api_tokens row.
        name:
          type: string
          maxLength: 120
        prefix:
          type: string
          minLength: 8
          maxLength: 8
          description: Indexed plaintext prefix, safe to log.
        plaintext:
          type: string
          description: |
            Full token (`nk_<prefix>_<secret>`). Store this in a password
            manager immediately — it will never be shown again.
          examples: ['nk_abcd1234_efghijklmnopqrstuvwxyz234567abcdefghijklmnop']
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true

    APITokenUsageEntry:
      type: object
      description: |
        One per-request execution-log row for an API token. Request +
        response bodies are capped at 8KB (see `request_bytes` /
        `response_bytes` for the true wire size) and JSON-redacted for
        known secret keys (`password`, `access_token`, `token`, ...).
      required: [id, token_id, occurred_at, method, path, status_code, latency_ms, remote_ip, request_bytes, response_bytes]
      properties:
        id:
          type: string
          description: ULID of the usage row.
        token_id:
          type: string
          description: ULID of the api_tokens row that authenticated the request.
        occurred_at:
          type: string
          format: date-time
        request_id:
          type: string
          description: Request ID stitching this row to the request-scoped log lines.
        method:
          type: string
          description: HTTP method (GET, POST, ...).
        path:
          type: string
          description: Request URL path — query string is never persisted.
          maxLength: 500
        status_code:
          type: integer
          minimum: 0
          maximum: 599
        latency_ms:
          type: integer
          description: Handler duration in milliseconds.
        remote_ip:
          type: string
          maxLength: 45
        user_agent:
          type: string
          maxLength: 500
        request_body:
          type: string
          description: Base64-encoded captured request body (up to 8KB after redaction).
        response_body:
          type: string
          description: Base64-encoded captured response body (up to 8KB).
        request_body_text:
          type: string
          description: Best-effort UTF-8 rendering of the request body when it decodes as text.
        response_body_text:
          type: string
          description: Best-effort UTF-8 rendering of the response body when it decodes as text.
        request_bytes:
          type: integer
          description: True wire size of the request body, before truncation.
        response_bytes:
          type: integer
          description: True wire size of the response body, before truncation.
        error_message:
          type: string
          description: Short failure summary — populated only for 4xx/5xx responses.
          maxLength: 1000

    APITokenUsageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/APITokenUsageEntry' }
        next_cursor:
          type: string
          description: Opaque token to echo back as `cursor` on the next request; absent when the caller reached the end.

    APITokenDailyPoint:
      type: object
      description: One (day, aggregate) tuple in an API-token metrics series.
      required: [day, total_requests, error_count, avg_latency_ms, bytes_in, bytes_out]
      properties:
        day:
          type: string
          format: date
          description: ISO calendar date (YYYY-MM-DD) in UTC.
        total_requests:
          type: integer
          format: int64
        error_count:
          type: integer
          format: int64
          description: Subset of total_requests whose status_code >= 400.
        avg_latency_ms:
          type: integer
          format: int64
        bytes_in:
          type: integer
          format: int64
        bytes_out:
          type: integer
          format: int64

    APITokenPathHit:
      type: object
      description: One entry in the top-paths ranking.
      required: [path, count]
      properties:
        path:
          type: string
        count:
          type: integer
          format: int64

    APITokenMetrics:
      type: object
      description: Aggregate KPIs + per-day series + status histogram + top paths for one API token.
      required: [total_requests, error_count, avg_latency_ms, bytes_in, bytes_out, by_day, by_status, top_paths]
      properties:
        total_requests:
          type: integer
          format: int64
        error_count:
          type: integer
          format: int64
        avg_latency_ms:
          type: integer
          format: int64
        bytes_in:
          type: integer
          format: int64
        bytes_out:
          type: integer
          format: int64
        by_day:
          type: array
          items: { $ref: '#/components/schemas/APITokenDailyPoint' }
        by_status:
          type: object
          description: Map of HTTP status code (as string) to count.
          additionalProperties:
            type: integer
            format: int64
        top_paths:
          type: array
          items: { $ref: '#/components/schemas/APITokenPathHit' }

    Problem:
      type: object
      description: RFC 7807 problem details.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: URI reference identifying the problem type.
          examples: ['https://nudgeway.dev/errors/validation']
        title:
          type: string
          examples: ['validation failed']
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
          examples: [400]
        detail:
          type: string
        instance:
          type: string
          format: uri
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

security:
  - sessionCookie: []
  - apiKey: []
