name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Pin explicitly to match go.mod's `go 1.27.1`. Using 'stable'
          # here can drift under us and cause golangci-lint / go-arch-lint
          # to fail with 'export data version too new'.
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      # Unit tests only (no build tag). Integration tests are opt-in via
      # `-tags integration` and require live MySQL/Redis/Kafka/HBase +
      # a docs/testdata seed; not run here.
      - name: unit tests
        run: go test -race -short ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=5m
      - name: go-arch-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/fe3dback/go-arch-lint/master/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" latest
          "$(go env GOPATH)/bin/go-arch-lint" check --project-path .

  openapi:
    name: openapi (spectral)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Spectral lint
        run: npx --yes @stoplight/spectral-cli lint internal/api/openapi/openapi.yaml --ruleset .spectral.yaml

  frontend:
    name: frontend (vite)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: install
        run: npm install
      - name: typecheck
        run: npm run typecheck
      - name: build
        run: npm run build
