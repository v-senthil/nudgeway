name: Deploy landing page to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "internal/api/openapi/openapi.yaml"
      - "docs/help/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refresh OpenAPI mirror
        run: cp internal/api/openapi/openapi.yaml landing/openapi.yaml
      - name: Mirror help center content
        run: |
          rm -rf landing/help
          mkdir -p landing/help
          cp -R docs/help/. landing/help/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing
      - id: deployment
        uses: actions/deploy-pages@v4
